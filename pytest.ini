[pytest]
# Pytest configuration for Altruix project

# Filter out Pyrogram deprecation warnings (external library issue)
filterwarnings =
    ignore::DeprecationWarning:pyrogram.*
    ignore:There is no current event loop:DeprecationWarning

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers

# Asyncio mode
asyncio_mode = auto
