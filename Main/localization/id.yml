GP_INFO_TEXT: "ℹ️ <b>Info Global Purgeme</b>\n\n• <b>Mode:</b> 'Terbaru' mulai dari pesan terakhir Anda, 'Terlama' mulai dari pesan paling awal.\n• <b>Offset:</b> Lewati N pesan pertama yang ditemukan.\n• <b>Notif:</b> Mengirim laporan ke Grup Log dan PM Bot Assistant setelah selesai.\n• <b>Filter Media:</b> Pilih jenis pesan tertentu untuk dihapus. Jika 'Semua' dipilih, semua jenis pesan akan dihapus.\n\nGunakan dengan hati-hati karena proses ini mempengaruhi banyak chat!"
